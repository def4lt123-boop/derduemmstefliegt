<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Der Dümmste fliegt – Quizmaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e1a;
    --panel:#121826;
    --panel-2:#1a2233;
    --border:#232c42;
    --amber:#f2a93b;
    --amber-dim:#b9812c;
    --teal:#4fd1c5;
    --danger:#e4572e;
    --text:#edeef0;
    --text-dim:#8b93a7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, #101a2e 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
  }
  #app{
    max-width:920px;
    margin:0 auto;
    padding:20px 16px calc(60px + env(safe-area-inset-bottom));
    padding-left:calc(16px + env(safe-area-inset-left));
    padding-right:calc(16px + env(safe-area-inset-right));
  }
  .eyebrow{
    font-family:'Space Mono',monospace;
    letter-spacing:.18em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--amber);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{content:'✈';font-size:13px;}
  h1.title{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(28px,6vw,42px);
    letter-spacing:.01em;
    margin:6px 0 2px;
    line-height:1.05;
  }
  .subtitle{color:var(--text-dim);font-size:14px;margin-bottom:24px;}
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:'Archivo Black',sans-serif;
    font-size:15px;
    letter-spacing:.04em;
    text-transform:uppercase;
    margin:0 0 14px;
    color:var(--amber);
  }
  label{
    display:block;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:6px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  input[type=text],input[type=number]{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    font-size:16px;
    padding:12px 12px;
    border-radius:8px;
    outline:none;
  }
  input[type=text]:focus,input[type=number]:focus{border-color:var(--amber);}
  select{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    font-size:16px;
    padding:12px 12px;
    border-radius:8px;
    outline:none;
    appearance:none;
    -webkit-appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, var(--amber) 50%), linear-gradient(135deg, var(--amber) 50%, transparent 50%);
    background-position:calc(100% - 20px) center, calc(100% - 15px) center;
    background-size:5px 5px, 5px 5px;
    background-repeat:no-repeat;
  }
  select:focus{border-color:var(--amber);}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  .row > div{flex:1;min-width:140px;}
  button{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    border:none;
    border-radius:9px;
    padding:13px 18px;
    min-height:44px;
    cursor:pointer;
    font-size:14px;
    letter-spacing:.02em;
    transition:transform .12s ease, filter .12s ease;
  }
  button:active{transform:scale(.97);}
  .btn-amber{background:var(--amber);color:#211405;}
  .btn-amber:hover{filter:brightness(1.08);}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-outline:hover{border-color:var(--amber);color:var(--amber);}
  .btn-teal{background:var(--teal);color:#052421;}
  .btn-danger{background:var(--danger);color:#2a0d05;}
  .btn-ghost{background:transparent;color:var(--text-dim);padding:8px;min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;}
  .btn-ghost:hover{color:var(--danger);}
  .btn-block{width:100%;}
  .btn-lg{padding:16px 22px;font-size:16px;}

  .pass-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
  .pass{
    background:var(--panel-2);
    border:1px dashed var(--amber-dim);
    border-radius:10px;
    padding:6px 6px 6px 12px;
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'Space Mono',monospace;
    font-size:13px;
  }
  .pass .flightno{color:var(--amber);}
  .pass button{padding:8px;font-size:13px;min-width:32px;min-height:32px;}

  details{border-top:1px solid var(--border);margin-top:16px;padding-top:14px;}
  summary{cursor:pointer;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);}
  summary:hover{color:var(--amber);}
  .qlist{margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  .qitem{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
  }
  .qitem .qtext{font-size:13px;}
  .qitem .qtext .a{color:var(--teal);font-size:12px;display:block;margin-top:2px;}
  .qcount{font-family:'Space Mono',monospace;color:var(--text-dim);font-size:12px;margin-top:8px;}

  /* Departures strip */
  .board{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:18px;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
    scroll-snap-type:x proximity;
  }
  .board-item{
    flex:0 0 auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    min-width:132px;
    font-family:'Space Mono',monospace;
    scroll-snap-align:start;
  }
  .board-item.out{opacity:.4;}
  .board-item.asking{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset;}
  .board-item.asking .status{color:var(--amber);font-weight:700;}
  .board-item .fn{font-size:10px;color:var(--amber);letter-spacing:.08em;}
  .board-item .nm{font-size:14px;font-weight:700;font-family:'Manrope',sans-serif;margin:2px 0 4px;}
  .board-item .status{font-size:10px;letter-spacing:.06em;color:var(--teal);}
  .board-item.out .status{color:var(--danger);}
  .hearts{font-size:13px;letter-spacing:2px;}
  .heart-on{color:var(--danger);}
  .heart-off{color:#3a2b2b;}

  /* Timer */
  .timer-wrap{text-align:center;margin:8px 0 22px;}
  .flip{
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:clamp(48px,14vw,72px);
    color:var(--amber);
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px 26px;
    display:inline-block;
    letter-spacing:.05em;
  }
  .flip.tick{animation:flip .3s ease;}
  @keyframes flip{
    0%{transform:rotateX(0deg);opacity:1;}
    45%{transform:rotateX(90deg);opacity:.3;}
    55%{transform:rotateX(-90deg);opacity:.3;}
    100%{transform:rotateX(0deg);opacity:1;}
  }
  .timer-controls{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap;}

  .qcard{text-align:center;padding:30px 20px;}
  .qcard .qnum{font-family:'Space Mono',monospace;color:var(--text-dim);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
  .qcard .target-name{font-family:'Archivo Black',sans-serif;font-size:clamp(24px,6vw,34px);color:var(--amber);margin:4px 0 10px;}
  .qcard .qtext{font-family:'Archivo Black',sans-serif;font-size:clamp(20px,4.5vw,28px);line-height:1.25;margin-bottom:18px;}
  .qcard .atext{
    display:inline-block;
    font-family:'Space Mono',monospace;
    color:var(--teal);
    background:rgba(79,209,197,.08);
    border:1px solid rgba(79,209,197,.3);
    border-radius:8px;
    padding:8px 16px;
    font-size:15px;
  }
  .qbtns{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap;}
  .stats{color:var(--text-dim);font-size:12px;margin-top:16px;font-family:'Space Mono',monospace;}

  .vote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px;}
  .vote-card{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 10px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .vote-card:hover{border-color:var(--danger);transform:translateY(-2px);}
  .vote-card .nm{font-weight:800;margin-bottom:6px;}

  .overlay{
    position:fixed;inset:0;
    background:rgba(6,9,16,.86);
    display:flex;align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:26px;
    max-width:360px;
    width:100%;
    text-align:center;
  }
  .modal .mbtns{display:flex;gap:10px;margin-top:18px;}
  .modal .mbtns button{flex:1;}

  .stamp{
    text-align:center;
    padding:50px 20px;
  }
  .stamp .plane{font-size:56px;animation:fly 1.1s ease forwards;}
  @keyframes fly{
    0%{transform:translateX(-40vw) rotate(-10deg);opacity:0;}
    60%{transform:translateX(0) rotate(0deg);opacity:1;}
    100%{transform:translateX(40vw) rotate(10deg);opacity:0;}
  }
  .stamp .word{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(26px,6vw,40px);
    color:var(--danger);
    margin-top:10px;
    letter-spacing:.03em;
  }
  .stamp .sub{color:var(--text-dim);margin-top:8px;}

  .winner{text-align:center;padding:40px 20px;position:relative;overflow:hidden;}
  .winner .trophy{font-size:60px;}
  .winner h2{font-family:'Archivo Black',sans-serif;font-size:clamp(26px,6vw,38px);margin:10px 0 6px;color:var(--amber);}
  .winner p{color:var(--text-dim);}
  .confetti-emoji{position:absolute;top:-20px;font-size:20px;animation:fall linear forwards;}
  @keyframes fall{
    to{transform:translateY(420px) rotate(360deg);opacity:0;}
  }

  .toolbar{display:flex;gap:10px;justify-content:flex-end;margin-bottom:10px;flex-wrap:wrap;}
  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  @media (max-width:480px){
    .qbtns button{flex:1 1 100%;}
  }
  .qr-box{background:#fff;border-radius:14px;padding:16px;display:inline-block;margin:10px auto;}
  .join-link{
    font-family:'Space Mono',monospace;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px;
    word-break:break-all;
    font-size:13px;
    color:var(--teal);
    text-align:center;
  }
  .lobby-player{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
    font-family:'Space Mono',monospace;
  }
  .big-status{
    text-align:center;
    padding:50px 20px;
  }
  .big-status .icon{font-size:48px;margin-bottom:14px;}
  .big-status h2{font-family:'Archivo Black',sans-serif;font-size:clamp(22px,6vw,32px);margin:0 0 8px;}
  .vote-tally{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    font-family:'Space Mono',monospace;
    font-size:13px;
  }
  .placement-badge{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(40px,12vw,64px);
    color:var(--amber);
    margin:8px 0;
  }
  .answer-waiting{
    text-align:center;
    color:var(--text-dim);
    font-family:'Space Mono',monospace;
    font-size:13px;
    padding:20px;
  }
  #wakeLockBtn{
    position:fixed;
    bottom:calc(16px + env(safe-area-inset-bottom));
    right:calc(16px + env(safe-area-inset-right));
    z-index:60;
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--amber);
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
    padding:0;
    min-height:0;
  }
  #wakeLockBtn.active{background:var(--amber);color:#211405;border-color:var(--amber);}
  #madeByFlo{
    position:fixed;
    bottom:calc(14px + env(safe-area-inset-bottom));
    left:calc(14px + env(safe-area-inset-left));
    z-index:60;
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.04em;
    color:var(--text-dim);
    opacity:.6;
    pointer-events:none;
    user-select:none;
  }
</style>
<div id="app"><div style="max-width:920px;margin:0 auto;padding:60px 16px;text-align:center;color:#8b93a7;font-family:'Space Mono',monospace;font-size:13px;">Lade …</div></div>
<button id="wakeLockBtn" title="Bildschirm wach halten">🔆</button>
<div id="madeByFlo">✈ made by Flo</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";

  /* ---------- Supabase-Konfiguration ---------- */
  const SUPABASE_URL = "https://clvcrmgmhzdwqbfxrhqk.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsdmNybWdtaHpkd3FiZnhyaHFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2ODEyMTQsImV4cCI6MjEwMzI1NzIxNH0.ks7jMMKOMAJA0EjGpMHOTv1LstEMWltGr9f4rFVpa6k";
  const supabaseClient = (window.supabase)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  /* ---------- Fragen-Datenbank (Start-Fragen, nur falls Supabase-Tabelle leer) ---------- */
  const SEED_QUESTIONS = [
    {frage:"Wie viele Bundesländer hat Österreich?", antwort:"9"},
    {frage:"Welcher Fluss fließt durch Wien?", antwort:"Die Donau"},
    {frage:"Wie hoch ist der höchste Berg Österreichs, der Großglockner?", antwort:"3.798 m"},
    {frage:"In welchem Jahr fiel die Berliner Mauer?", antwort:"1989"},
    {frage:"Wie viele Planeten hat unser Sonnensystem?", antwort:"8"},
    {frage:"Welches Land hat die meisten Einwohner der Welt?", antwort:"Indien"},
    {frage:"Wie heißt die Hauptstadt von Australien?", antwort:"Canberra"},
    {frage:"Wie viele Herzkammern hat ein Mensch?", antwort:"4"},
    {frage:"Welches Element hat das chemische Symbol 'Au'?", antwort:"Gold"},
    {frage:"Wer schrieb 'Faust'?", antwort:"Johann Wolfgang von Goethe"},
    {frage:"Wie viele Ringe hat das olympische Symbol?", antwort:"5"},
    {frage:"Welches Tier ist das schnellste Landtier der Welt?", antwort:"Der Gepard"},
    {frage:"Wie viele Zeitzonen gibt es weltweit ungefähr?", antwort:"24"},
    {frage:"In welcher Stadt steht der Eiffelturm?", antwort:"Paris"},
    {frage:"Wie viele Spieler stehen bei einem Fußballteam auf dem Feld?", antwort:"11"},
    {frage:"Welches ist das größte Säugetier der Welt?", antwort:"Der Blauwal"},
    {frage:"Wie viele Kontinente gibt es?", antwort:"7"},
    {frage:"Wer war der erste Mensch auf dem Mond?", antwort:"Neil Armstrong"},
    {frage:"Welche Farben hat die österreichische Flagge?", antwort:"Rot-Weiß-Rot"},
    {frage:"Wie viele Zähne hat ein erwachsener Mensch normalerweise?", antwort:"32"},
    {frage:"Welcher Ozean ist der größte der Welt?", antwort:"Der Pazifik"},
    {frage:"Wie heißt die Währung in Japan?", antwort:"Yen"},
    {frage:"Wie viele Beine hat eine Spinne?", antwort:"8"},
    {frage:"In welchem Land liegt die Stadt Innsbruck?", antwort:"Österreich (Tirol)"},
    {frage:"Wie viele Minuten dauert eine Fußball-Halbzeit regulär?", antwort:"45 Minuten"}
  ];

  /* ---------------- Rollen-Erkennung über URL ---------------- */
  const urlParams = new URLSearchParams(window.location.search);
  const joinCode = urlParams.get("join");
  const ROLE = joinCode ? "player" : "host";

  /* ---------------- State ---------------- */
  let state = {
    role: ROLE,
    code: joinCode ? joinCode.toUpperCase() : null,
    myPlayerId: null,          // eigene Spieler-ID (nur role=player)
    myName: "",
    session: null,             // Mirror von game_sessions
    players: [],               // Mirror von session_players
    votes: [],                 // Mirror von round_votes (aktuelle Runde, nur Host braucht das)
    finaleAnswers: [],         // Mirror von finale_answers (aktuelle Frage, nur Host)
    allFinaleAnswers: [],      // Mirror aller finale_answers der Session (für die Finale-Übersicht)
    questions: [],             // Fragen-Datenbank (nur Host, für Verwaltung + Ziehen)
    loadError: null,
    roundSeconds: 180,
    startHearts: 3,
    channel: null,
    tickId: null,
    pollId: null,
    _beepedRoundEnd: null,
    _beepedVoteOpen: null
  };

  /* ---------------- Helpers ---------------- */
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function pad(n){ return n.toString().padStart(2,"0"); }
  function fmt(sec){
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec/60), s = sec%60;
    return pad(m)+":"+pad(s);
  }
  function uid(){ return Math.random().toString(36).slice(2,9); }
  function makeRoomCode(){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // ohne 0/O/1/I
    let out = "";
    for(let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
    return out;
  }
  function secsUntil(iso){
    if(!iso) return 0;
    return (new Date(iso).getTime() - Date.now())/1000;
  }
  function activePlayers(){ return state.players.filter(p=>!p.is_out); }
  function joinUrl(code){
    return window.location.origin + window.location.pathname + "?join=" + code;
  }

  /* ---------------- Fragen-Datenbank: Supabase (Host) ---------------- */
  async function loadQuestions(){
    state.loadError = null;
    if(!supabaseClient){
      state.loadError = "Supabase ist nicht konfiguriert.";
      state.questions = [];
      return;
    }
    try{
      const { data, error } = await supabaseClient.from("questions").select("*").order("id",{ascending:true});
      if(error) throw error;
      if(data && data.length>0){
        state.questions = data;
      }else{
        const rows = SEED_QUESTIONS.map(q=>({frage:q.frage, antwort:q.antwort, anmerkung:null, used:false}));
        const ins = await supabaseClient.from("questions").insert(rows).select();
        state.questions = ins.error ? [] : ins.data;
      }
    }catch(e){
      state.loadError = "Verbindung zu Supabase fehlgeschlagen: " + (e.message||e);
      state.questions = [];
    }
  }

  function toQId(raw){
    const n = Number(raw);
    return !isNaN(n) ? n : raw;
  }

  async function commitQuestion(frage, antwort, anmerkung){
    try{
      const { data, error } = await supabaseClient.from("questions")
        .insert({frage, antwort, anmerkung: anmerkung||null, used:false})
        .select().single();
      if(error) throw error;
      state.questions.push(data);
    }catch(e){
      alert("Speichern fehlgeschlagen: "+(e.message||e));
      return;
    }
    render();
  }

  async function deleteQuestion(id){
    state.questions = state.questions.filter(q=>q.id!==id);
    render();
    try{ await supabaseClient.from("questions").delete().eq("id", id); }catch(e){}
  }

  function qListHtml(filter){
    const term = (filter||"").toLowerCase().trim();
    const filtered = term
      ? state.questions.filter(q=> q.frage.toLowerCase().includes(term) || q.antwort.toLowerCase().includes(term))
      : state.questions;
    if(filtered.length===0){
      return `<div style="color:var(--text-dim);font-size:13px;padding:6px 2px;">Keine Treffer.</div>`;
    }
    const shown = filtered.slice(0,300);
    let html = shown.map(q=>`
      <div class="qitem">
        <div class="qtext">

  /* ---------- Duplikat-Check (Jaccard + Levenshtein), unverändert ---------- */
  function normalizeText(s){ return s.toLowerCase().replace(/[^\wäöüß\s]/gi," ").replace(/\s+/g," ").trim(); }
  function wordSet(s){ return new Set(normalizeText(s).split(" ").filter(Boolean)); }
  function jaccard(a,b){
    const sa=wordSet(a), sb=wordSet(b);
    if(sa.size===0 || sb.size===0) return 0;
    let inter=0; sa.forEach(w=>{ if(sb.has(w)) inter++; });
    const union = sa.size + sb.size - inter;
    return union===0 ? 0 : inter/union;
  }
  function levenshtein(a,b){
    const al=a.length, bl=b.length;
    if(al===0) return bl; if(bl===0) return al;
    const dp = []; for(let i=0;i<=al;i++) dp.push([i]);
    for(let j=1;j<=bl;j++) dp[0][j]=j;
    for(let i=1;i<=al;i++) for(let j=1;j<=bl;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
    return dp[al][bl];
  }
  function levSim(a,b){
    const na=normalizeText(a), nb=normalizeText(b);
    const maxLen = Math.max(na.length, nb.length) || 1;
    return 1 - levenshtein(na,nb)/maxLen;
  }
  function findSimilar(newFrage){
    return state.questions
      .map(q=>({q, score: Math.max(jaccard(newFrage,q.frage), levSim(newFrage,q.frage))}))
      .filter(x=>x.score>=0.55).sort((a,b)=>b.score-a.score).slice(0,4);
  }

  /* ============================================================
     REALTIME: Sync mit Supabase
     ============================================================ */
  async function fetchSession(){
    const { data } = await supabaseClient.from("game_sessions").select("*").eq("code", state.code).single();
    state.session = data || null;
  }
  async function fetchPlayers(){
    const { data } = await supabaseClient.from("session_players").select("*").eq("session_code", state.code).order("joined_at",{ascending:true});
    state.players = data || [];
  }
  async function fetchVotes(){
    if(!state.session) return;
    const { data } = await supabaseClient.from("round_votes").select("*").eq("session_code", state.code).eq("round_number", state.session.round_number);
    state.votes = data || [];
  }
  async function fetchFinaleAnswers(){
    if(!state.session) return;
    const { data } = await supabaseClient.from("finale_answers").select("*").eq("session_code", state.code).eq("question_index", state.session.finale_question_index);
    state.finaleAnswers = data || [];
  }
  async function fetchAllFinaleAnswers(){
    if(!state.session) return;
    const { data } = await supabaseClient.from("finale_answers").select("*").eq("session_code", state.code).order("question_index",{ascending:true});
    state.allFinaleAnswers = data || [];
  }

  async function syncAll(){
    const before = JSON.stringify([state.session, state.players, state.votes, state.finaleAnswers, state.allFinaleAnswers]);
    await fetchSession();
    if(!state.session){ render(); return; }
    await fetchPlayers();
    if(state.role==="host" && state.session.phase==="voting") await fetchVotes();
    if(state.session.phase==="finale-question") await fetchFinaleAnswers();
    if(state.role==="host" && state.session.phase==="finale-review") await fetchAllFinaleAnswers();
    const after = JSON.stringify([state.session, state.players, state.votes, state.finaleAnswers, state.allFinaleAnswers]);
    if(after !== before) render();
  }

  function subscribeRealtime(){
    if(state.channel) return;
    state.channel = supabaseClient.channel("room-"+state.code)
      .on("postgres_changes", {event:"*", schema:"public", table:"game_sessions", filter:`code=eq.${state.code}`}, syncAll)
      .on("postgres_changes", {event:"*", schema:"public", table:"session_players", filter:`session_code=eq.${state.code}`}, syncAll)
      .on("postgres_changes", {event:"*", schema:"public", table:"round_votes", filter:`session_code=eq.${state.code}`}, syncAll)
      .on("postgres_changes", {event:"*", schema:"public", table:"finale_answers", filter:`session_code=eq.${state.code}`}, syncAll)
      .subscribe();
    if(!state.pollId){
      // Sicherheitsnetz: falls mal ein Realtime-Event auf dem Weg verloren geht
      // (z.B. schwaches Mobilfunknetz), holt das hier spätestens nach 4s den
      // korrekten Stand nach.
      state.pollId = setInterval(syncAll, 4000);
    }
  }

  /* ============================================================
     HOST-Aktionen
     ============================================================ */
  async function hostCreateSession(){
    const code = makeRoomCode();
    const { error } = await supabaseClient.from("game_sessions").insert({
      code, phase:"lobby", round_seconds: state.roundSeconds, start_hearts: state.startHearts
    });
    if(error){ alert("Raum konnte nicht erstellt werden: "+error.message); return; }
    state.code = code;
    try{ localStorage.setItem("ddf_host_session", code); }catch(e){}
    subscribeRealtime();
    await syncAll();
  }

  async function hostStartGame(){
    const active = activePlayers();
    if(active.length<2) return;
    if(active.length===2){
      await hostStartFinale();
      return;
    }
    await hostBeginRound();
  }

  async function hostBeginRound(){
    const unused = state.questions.filter(q=>!q.used);
    if(unused.length===0){ alert("Alle Fragen wurden bereits verwendet. Bitte Fragen-Pool zurücksetzen."); return; }
    const active = activePlayers();
    const nextTurn = (state.session.turn_index||0);
    const player = active[nextTurn % active.length];
    const q = shuffle(unused)[0];
    const roundNumber = (state.session.round_number||0) + 1;
    await supabaseClient.from("game_sessions").update({
      phase:"round",
      round_number: roundNumber,
      round_ends_at: new Date(Date.now() + state.session.round_seconds*1000).toISOString(),
      current_question: {id:q.id, frage:q.frage, antwort:q.antwort, anmerkung:q.anmerkung},
      current_target_player_id: player.id,
      turn_index: nextTurn,
      round_wrong: []
    }).eq("code", state.code);
  }

  async function hostNextQuestion(mark){
    const cq = state.session.current_question;
    const targetId = state.session.current_target_player_id;
    let newWrong = state.session.round_wrong || [];
    if(cq && cq.id!=null){
      const target = state.players.find(p=>p.id===targetId);
      markUsedRemote(cq.id);
      if(mark==="wrong"){
        newWrong = newWrong.concat([{frage:cq.frage, antwort:cq.antwort, anmerkung:cq.anmerkung, playerName: target?target.name:"–"}]);
      }
    }
    const unused = state.questions.filter(q=>!q.used);
    const active = activePlayers();
    const nextTurn = (state.session.turn_index||0) + 1;
    const player = active[nextTurn % active.length];
    let update;
    if(unused.length===0){
      update = { current_question: {id:null, frage:"Keine unverwendeten Fragen mehr übrig.", antwort:"–", anmerkung:null}, turn_index: nextTurn, current_target_player_id: player.id, round_wrong: newWrong };
    }else{
      const q = shuffle(unused)[0];
      update = { current_question: {id:q.id, frage:q.frage, antwort:q.antwort, anmerkung:q.anmerkung}, turn_index: nextTurn, current_target_player_id: player.id, round_wrong: newWrong };
    }
    await supabaseClient.from("game_sessions").update(update).eq("code", state.code);
  }

  async function hostEndRound(){
    await supabaseClient.from("game_sessions").update({
      phase:"voting",
      voting_opens_at: new Date(Date.now() + 60000).toISOString()
    }).eq("code", state.code);
  }

  async function hostConfirmElimination(playerId){
    const p = state.players.find(x=>x.id===playerId);
    if(!p) return;
    const newHearts = p.hearts - 1;
    if(newHearts<=0){
      const placement = activePlayers().length; // Anzahl noch Aktiver inkl. diesem = seine Platzierung
      await supabaseClient.from("session_players").update({hearts:0, is_out:true, placement}).eq("id", playerId);
      await supabaseClient.from("game_sessions").update({phase:"stamp", stamp_player_id: playerId}).eq("code", state.code);
      setTimeout(async ()=>{
        await fetchPlayers();
        const remaining = activePlayers();
        if(remaining.length<=1){
          const winner = remaining[0];
          if(winner) await supabaseClient.from("session_players").update({placement:1}).eq("id", winner.id);
          await supabaseClient.from("game_sessions").update({phase:"winner"}).eq("code", state.code);
        }else if(remaining.length===2){
          await hostStartFinale();
        }else{
          await hostBeginRound();
        }
      }, 1600);
    }else{
      await supabaseClient.from("session_players").update({hearts:newHearts}).eq("id", playerId);
      await hostBeginRound();
    }
  }

  async function hostStartFinale(){
    const unused = state.questions.filter(q=>!q.used);
    if(unused.length===0){
      alert("Keine unverwendeten Fragen mehr für das Finale übrig.");
      return;
    }
    const count = Math.min(10, unused.length);
    const chosen = shuffle(unused).slice(0, count).map(q=>({id:q.id, frage:q.frage, antwort:q.antwort, anmerkung:q.anmerkung}));
    const active = activePlayers();
    await supabaseClient.from("game_sessions").update({
      phase:"finale-intro",
      finale_player_ids: active.map(p=>p.id),
      finale_questions: chosen,
      finale_question_index: 0,
      finale_winner_id: null
    }).eq("code", state.code);
  }

  async function hostBeginFinaleQuestionPhase(){
    await supabaseClient.from("game_sessions").update({ phase:"finale-question" }).eq("code", state.code);
  }

  async function hostMarkFinaleAnswer(playerId, mark){
    const idx = state.session.finale_question_index;
    const local = state.finaleAnswers.find(a=>a.player_id===playerId);
    if(local){ local.mark = mark; render(); }
    await supabaseClient.from("finale_answers")
      .update({ mark })
      .eq("session_code", state.code)
      .eq("question_index", idx)
      .eq("player_id", playerId);
  }

  async function hostAdvanceFinale(){
    const s = state.session;
    const q = s.finale_questions[s.finale_question_index];
    if(q && q.id!=null) markUsedRemote(q.id);
    const nextIndex = s.finale_question_index + 1;
    if(nextIndex >= s.finale_questions.length){
      await supabaseClient.from("game_sessions").update({ phase:"finale-review" }).eq("code", state.code);
    }else{
      await supabaseClient.from("game_sessions").update({ finale_question_index: nextIndex }).eq("code", state.code);
    }
  }

  async function hostStartFinaleTieBreak(){
    const unused = state.questions.filter(q=>!q.used);
    if(unused.length===0){
      alert("Keine unverwendeten Fragen mehr übrig — Unentschieden bleibt bestehen.");
      return;
    }
    const count = Math.min(5, unused.length);
    const extra = shuffle(unused).slice(0, count).map(q=>({id:q.id, frage:q.frage, antwort:q.antwort, anmerkung:q.anmerkung}));
    const s = state.session;
    const newQuestions = (s.finale_questions||[]).concat(extra);
    await supabaseClient.from("game_sessions").update({
      phase:"finale-tiebreak-intro",
      finale_questions: newQuestions,
      finale_question_index: s.finale_questions.length // Zeiger setzt genau bei den neuen Fragen an
    }).eq("code", state.code);
  }

  async function hostConfirmFinaleWinner(playerId){
    const loser = state.session.finale_player_ids.find(id=>id!==playerId);
    await supabaseClient.from("session_players").update({placement:1}).eq("id", playerId);
    if(loser) await supabaseClient.from("session_players").update({placement:2}).eq("id", loser);
    await supabaseClient.from("game_sessions").update({ phase:"finale-result", finale_winner_id: playerId }).eq("code", state.code);
  }

  /* ============================================================
     PLAYER-Aktionen
     ============================================================ */
  async function playerJoin(name){
    name = name.trim();
    if(!name) return;
    const startHearts = (state.session && state.session.start_hearts) || 3;
    const { data, error } = await supabaseClient.from("session_players")
      .insert({session_code: state.code, name, hearts: startHearts})
      .select().single();
    if(error){ alert("Beitreten fehlgeschlagen: "+error.message); return; }
    state.myPlayerId = data.id;
    state.myName = name;
    try{ localStorage.setItem("ddf_player_session", JSON.stringify({code: state.code, playerId: data.id, name})); }catch(e){}
    subscribeRealtime();
    await syncAll();
  }

    try{
      await supabaseClient.from("round_votes").insert({
        session_code: state.code,
        round_number: state.session.round_number,
        voter_id: state.myPlayerId,
        target_id: targetId
      });
    }catch(e){}
    render();

    try{
      await supabaseClient.from("finale_answers").upsert({
        session_code: state.code,
        question_index: state.session.finale_question_index,
        player_id: state.myPlayerId,
        given_answer: text,
        mark: null
      }, { onConflict: "session_code,question_index,player_id" });

  function boardStrip(askingId){
    return `<div class="board">${state.players.map(p=>`
      <div class="board-item ${p.is_out?'out':''} ${p.id===askingId?'asking':''}">
        <div class="nm">${escapeHtml(p.name)}</div>

        <div class="status">${p.is_out?('✈ '+ (p.placement?p.placement+'. Platz':'raus')):(p.id===askingId?'jetzt dran':'boarding')}</div>
      </div>`).join("")}</div>`;

  function render(){
    clearInterval(state.tickId);
    state.tickId = null;
    if(!state.code){
      return state.role==="host" ? renderHostLanding() : renderPlayerNeedsCode();
    }
    if(!state.session){
      app.innerHTML = `${header()}<div class="card"><p class="subtitle">Lade Raum …</p></div>`;
      return;
    }
    if(state.role==="player" && !state.myPlayerId){
      return renderPlayerJoinForm();
    }
    const phase = state.session.phase;
    if(phase==="winner" || phase==="finale-result"){
      try{
        if(state.role==="host") localStorage.removeItem("ddf_host_session");
        else localStorage.removeItem("ddf_player_session");
      }catch(e){}
    }
    if(state.role==="host"){
      if(phase==="lobby") return renderHostLobby();
      if(phase==="round") return renderHostRound();
      if(phase==="voting") return renderHostVoting();
      if(phase==="stamp") return renderHostStamp();
      if(phase==="finale-intro") return renderHostFinaleIntro();
      if(phase==="finale-tiebreak-intro") return renderHostFinaleTiebreakIntro();
      if(phase==="finale-question") return renderHostFinaleQuestion();
      if(phase==="finale-review") return renderHostFinaleReview();
      if(phase==="finale-result") return renderHostFinaleResult();
      if(phase==="winner") return renderHostWinner();
    }else{
      if(phase==="lobby") return renderPlayerLobby();
      if(phase==="round") return renderPlayerRound();
      if(phase==="voting") return renderPlayerVoting();
      if(phase==="stamp") return renderPlayerStamp();
      if(phase==="finale-intro") return renderPlayerFinaleIntro();
      if(phase==="finale-tiebreak-intro") return renderPlayerFinaleIntro();
      if(phase==="finale-question") return renderPlayerFinaleQuestion();
      if(phase==="finale-review") return renderPlayerFinaleWaiting();
      if(phase==="finale-result") return renderPlayerFinaleResult();
      if(phase==="winner") return renderPlayerWinner();
    }
  }

  /* ---------- Lokaler Timer-Tick (nur fürs Countdown-Display) ---------- */
  /* ---------- Ton bei Timer-Ende ---------- */
  let audioCtx = null;
  function ensureAudioCtx(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    }
    if(audioCtx && audioCtx.state==="suspended"){ audioCtx.resume(); }
  }
  function playBeep(){
    ensureAudioCtx();
    if(!audioCtx) return;
    try{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.55);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime+0.6);
    }catch(e){}
  }

  function startLocalTicker(onTick){
    clearInterval(state.tickId);
    state.tickId = setInterval(()=>{ if(onTick) onTick(); }, 1000);
  }

  /* ---------- Bildschirm wach halten ---------- */

  function updateWakeLockBtn(){

      btn.classList.add("active");
    }else{
      btn.textContent = "🔆";
      btn.title = "Bildschirm wach halten";
      btn.classList.remove("active");
    }
  }
  async function requestWakeLock(){
    if(!("wakeLock" in navigator)) return false;
    try{
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", ()=>{ wakeLock = null; updateWakeLockBtn(); });
      return true;
    }catch(e){ return false; }
  }
  async function toggleWakeLock(){
    if(wakeLock){
      wantWakeLock = false;
      try{ await wakeLock.release(); }catch(e){}
      wakeLock = null;
      updateWakeLockBtn();
      return;
    }
    if(!("wakeLock" in navigator)){
      alert("Dein Browser unterstützt das Wachhalten des Bildschirms leider nicht.");
      return;
    }
    wantWakeLock = true;
    const ok = await requestWakeLock();
    if(!ok) alert("Bildschirm-Sperre konnte nicht aktiviert werden.");
    updateWakeLockBtn();
  }
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState==="visible" && wantWakeLock && !wakeLock){
      requestWakeLock().then(updateWakeLockBtn);
    }
  });
  document.getElementById("wakeLockBtn").onclick = toggleWakeLock;

  /* ---------- Schutz vor versehentlichem Neuladen/Schließen ---------- */
  window.addEventListener("beforeunload", function(e){
    const joined = state.role==="host" ? !!state.code : !!state.myPlayerId;
    const finished = state.session && (state.session.phase==="winner" || state.session.phase==="finale-result");
    if(!joined || finished) return;
    e.preventDefault();
    e.returnValue = "";
  });

  /* ---------------- Init ---------------- */
  async function init(){
    if(ROLE==="host"){
      await loadQuestions();
      let restored = false;
      try{
        const savedCode = localStorage.getItem("ddf_host_session");
        if(savedCode){
          const { data } = await supabaseClient.from("game_sessions").select("code").eq("code", savedCode).single();
          if(data){
            state.code = savedCode;
            subscribeRealtime();
            await syncAll();
            restored = true;
          }else{
            localStorage.removeItem("ddf_host_session");
          }
        }
      }catch(e){}
      if(!restored) render();
    }else{
      let restored = false;
      try{
        const saved = JSON.parse(localStorage.getItem("ddf_player_session") || "null");
        if(saved && saved.code === state.code){
          const { data } = await supabaseClient.from("session_players").select("id").eq("id", saved.playerId).eq("session_code", state.code).single();
          if(data){
            state.myPlayerId = saved.playerId;
            state.myName = saved.name;
            restored = true;
          }else{
            localStorage.removeItem("ddf_player_session");
          }
        }
      }catch(e){}
      render();
      subscribeRealtime();
      await syncAll();
    }
  }
  init();
})();

</script>
</body>
</html>
