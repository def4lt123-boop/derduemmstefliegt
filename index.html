<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Der Dümmste fliegt – Quizmaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e1a;
    --panel:#121826;
    --panel-2:#1a2233;
    --border:#232c42;
    --amber:#f2a93b;
    --amber-dim:#b9812c;
    --teal:#4fd1c5;
    --danger:#e4572e;
    --text:#edeef0;
    --text-dim:#8b93a7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, #101a2e 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
  }
  #app{
    max-width:920px;
    margin:0 auto;
    padding:20px 16px calc(60px + env(safe-area-inset-bottom));
    padding-left:calc(16px + env(safe-area-inset-left));
    padding-right:calc(16px + env(safe-area-inset-right));
  }
  .eyebrow{
    font-family:'Space Mono',monospace;
    letter-spacing:.18em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--amber);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{content:'✈';font-size:13px;}
  h1.title{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(28px,6vw,42px);
    letter-spacing:.01em;
    margin:6px 0 2px;
    line-height:1.05;
  }
  .subtitle{color:var(--text-dim);font-size:14px;margin-bottom:24px;}
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:'Archivo Black',sans-serif;
    font-size:15px;
    letter-spacing:.04em;
    text-transform:uppercase;
    margin:0 0 14px;
    color:var(--amber);
  }
  label{
    display:block;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:6px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  input[type=text],input[type=number]{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    font-size:16px;
    padding:12px 12px;
    border-radius:8px;
    outline:none;
  }
  input[type=text]:focus,input[type=number]:focus{border-color:var(--amber);}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  .row > div{flex:1;min-width:140px;}
  button{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    border:none;
    border-radius:9px;
    padding:13px 18px;
    min-height:44px;
    cursor:pointer;
    font-size:14px;
    letter-spacing:.02em;
    transition:transform .12s ease, filter .12s ease;
  }
  button:active{transform:scale(.97);}
  .btn-amber{background:var(--amber);color:#211405;}
  .btn-amber:hover{filter:brightness(1.08);}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-outline:hover{border-color:var(--amber);color:var(--amber);}
  .btn-teal{background:var(--teal);color:#052421;}
  .btn-danger{background:var(--danger);color:#2a0d05;}
  .btn-ghost{background:transparent;color:var(--text-dim);padding:8px;min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;}
  .btn-ghost:hover{color:var(--danger);}
  .btn-block{width:100%;}
  .btn-lg{padding:16px 22px;font-size:16px;}

  .pass-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
  .pass{
    background:var(--panel-2);
    border:1px dashed var(--amber-dim);
    border-radius:10px;
    padding:6px 6px 6px 12px;
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'Space Mono',monospace;
    font-size:13px;
  }
  .pass .flightno{color:var(--amber);}
  .pass button{padding:8px;font-size:13px;min-width:32px;min-height:32px;}

  details{border-top:1px solid var(--border);margin-top:16px;padding-top:14px;}
  summary{cursor:pointer;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);}
  summary:hover{color:var(--amber);}
  .qlist{margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  .qitem{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
  }
  .qitem .qtext{font-size:13px;}
  .qitem .qtext .a{color:var(--teal);font-size:12px;display:block;margin-top:2px;}
  .qcount{font-family:'Space Mono',monospace;color:var(--text-dim);font-size:12px;margin-top:8px;}

  /* Departures strip */
  .board{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:18px;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
    scroll-snap-type:x proximity;
  }
  .board-item{
    flex:0 0 auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    min-width:132px;
    font-family:'Space Mono',monospace;
    scroll-snap-align:start;
  }
  .board-item.out{opacity:.4;}
  .board-item.asking{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset;}
  .board-item.asking .status{color:var(--amber);font-weight:700;}
  .board-item .fn{font-size:10px;color:var(--amber);letter-spacing:.08em;}
  .board-item .nm{font-size:14px;font-weight:700;font-family:'Manrope',sans-serif;margin:2px 0 4px;}
  .board-item .status{font-size:10px;letter-spacing:.06em;color:var(--teal);}
  .board-item.out .status{color:var(--danger);}
  .hearts{font-size:13px;letter-spacing:2px;}
  .heart-on{color:var(--danger);}
  .heart-off{color:#3a2b2b;}

  /* Timer */
  .timer-wrap{text-align:center;margin:8px 0 22px;}
  .flip{
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:clamp(48px,14vw,72px);
    color:var(--amber);
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px 26px;
    display:inline-block;
    letter-spacing:.05em;
  }
  .flip.tick{animation:flip .3s ease;}
  @keyframes flip{
    0%{transform:rotateX(0deg);opacity:1;}
    45%{transform:rotateX(90deg);opacity:.3;}
    55%{transform:rotateX(-90deg);opacity:.3;}
    100%{transform:rotateX(0deg);opacity:1;}
  }
  .timer-controls{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap;}

  .qcard{text-align:center;padding:30px 20px;}
  .qcard .qnum{font-family:'Space Mono',monospace;color:var(--text-dim);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
  .qcard .target-name{font-family:'Archivo Black',sans-serif;font-size:clamp(24px,6vw,34px);color:var(--amber);margin:4px 0 10px;}
  .qcard .qtext{font-family:'Archivo Black',sans-serif;font-size:clamp(20px,4.5vw,28px);line-height:1.25;margin-bottom:18px;}
  .qcard .atext{
    display:inline-block;
    font-family:'Space Mono',monospace;
    color:var(--teal);
    background:rgba(79,209,197,.08);
    border:1px solid rgba(79,209,197,.3);
    border-radius:8px;
    padding:8px 16px;
    font-size:15px;
  }
  .qbtns{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap;}
  .stats{color:var(--text-dim);font-size:12px;margin-top:16px;font-family:'Space Mono',monospace;}

  .vote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px;}
  .vote-card{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 10px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .vote-card:hover{border-color:var(--danger);transform:translateY(-2px);}
  .vote-card .nm{font-weight:800;margin-bottom:6px;}

  .overlay{
    position:fixed;inset:0;
    background:rgba(6,9,16,.86);
    display:flex;align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:26px;
    max-width:360px;
    width:100%;
    text-align:center;
  }
  .modal .mbtns{display:flex;gap:10px;margin-top:18px;}
  .modal .mbtns button{flex:1;}

  .stamp{
    text-align:center;
    padding:50px 20px;
  }
  .stamp .plane{font-size:56px;animation:fly 1.1s ease forwards;}
  @keyframes fly{
    0%{transform:translateX(-40vw) rotate(-10deg);opacity:0;}
    60%{transform:translateX(0) rotate(0deg);opacity:1;}
    100%{transform:translateX(40vw) rotate(10deg);opacity:0;}
  }
  .stamp .word{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(26px,6vw,40px);
    color:var(--danger);
    margin-top:10px;
    letter-spacing:.03em;
  }
  .stamp .sub{color:var(--text-dim);margin-top:8px;}

  .winner{text-align:center;padding:40px 20px;position:relative;overflow:hidden;}
  .winner .trophy{font-size:60px;}
  .winner h2{font-family:'Archivo Black',sans-serif;font-size:clamp(26px,6vw,38px);margin:10px 0 6px;color:var(--amber);}
  .winner p{color:var(--text-dim);}
  .confetti-emoji{position:absolute;top:-20px;font-size:20px;animation:fall linear forwards;}
  @keyframes fall{
    to{transform:translateY(420px) rotate(360deg);opacity:0;}
  }

  .toolbar{display:flex;gap:10px;justify-content:flex-end;margin-bottom:10px;flex-wrap:wrap;}
  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  @media (max-width:480px){
    .qbtns button{flex:1 1 100%;}
  }
</style>
</head>
<body>
<div id="app"><div style="max-width:920px;margin:0 auto;padding:60px 16px;text-align:center;color:#8b93a7;font-family:'Space Mono',monospace;font-size:13px;">Lade Fragen-Datenbank …</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";

  /* ---------- Supabase-Konfiguration ----------
     Trage hier die Daten deines Supabase-Projekts ein
     (Project Settings → API → Project URL / anon public key).
     Passendes SQL für die Tabelle liegt separat bereit.
  ---------------------------------------------- */
  const SUPABASE_URL = "https://clvcrmgmhzdwqbfxrhqk.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsdmNybWdtaHpkd3FiZnhyaHFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2ODEyMTQsImV4cCI6MjEwMzI1NzIxNH0.ks7jMMKOMAJA0EjGpMHOTv1LstEMWltGr9f4rFVpa6k";

  const supabaseClient = (window.supabase && SUPABASE_URL.indexOf("DEINE-PROJEKT-URL")===-1)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  /* ---------- Start-Fragen -----------
     Werden nur einmalig verwendet, falls die Supabase-Tabelle beim allerersten
     Laden noch leer ist (siehe seedIfEmpty weiter unten).
  ------------------------------------------- */
  const SEED_QUESTIONS = [
    {frage:"Wie viele Bundesländer hat Österreich?", antwort:"9"},
    {frage:"Welcher Fluss fließt durch Wien?", antwort:"Die Donau"},
    {frage:"Wie hoch ist der höchste Berg Österreichs, der Großglockner?", antwort:"3.798 m"},
    {frage:"In welchem Jahr fiel die Berliner Mauer?", antwort:"1989"},
    {frage:"Wie viele Planeten hat unser Sonnensystem?", antwort:"8"},
    {frage:"Welches Land hat die meisten Einwohner der Welt?", antwort:"Indien"},
    {frage:"Wie heißt die Hauptstadt von Australien?", antwort:"Canberra"},
    {frage:"Wie viele Herzkammern hat ein Mensch?", antwort:"4"},
    {frage:"Welches Element hat das chemische Symbol 'Au'?", antwort:"Gold"},
    {frage:"Wer schrieb 'Faust'?", antwort:"Johann Wolfgang von Goethe"},
    {frage:"Wie viele Ringe hat das olympische Symbol?", antwort:"5"},
    {frage:"Welches Tier ist das schnellste Landtier der Welt?", antwort:"Der Gepard"},
    {frage:"Wie viele Zeitzonen gibt es weltweit ungefähr?", antwort:"24"},
    {frage:"In welcher Stadt steht der Eiffelturm?", antwort:"Paris"},
    {frage:"Wie viele Spieler stehen bei einem Fußballteam auf dem Feld?", antwort:"11"},
    {frage:"Welches ist das größte Säugetier der Welt?", antwort:"Der Blauwal"},
    {frage:"Wie viele Kontinente gibt es?", antwort:"7"},
    {frage:"Wer war der erste Mensch auf dem Mond?", antwort:"Neil Armstrong"},
    {frage:"Welche Farben hat die österreichische Flagge?", antwort:"Rot-Weiß-Rot"},
    {frage:"Wie viele Zähne hat ein erwachsener Mensch normalerweise?", antwort:"32"},
    {frage:"Welcher Ozean ist der größte der Welt?", antwort:"Der Pazifik"},
    {frage:"Wie heißt die Währung in Japan?", antwort:"Yen"},
    {frage:"Wie viele Beine hat eine Spinne?", antwort:"8"},
    {frage:"In welchem Land liegt die Stadt Innsbruck?", antwort:"Österreich (Tirol)"},
    {frage:"Wie viele Minuten dauert eine Fußball-Halbzeit regulär?", antwort:"45 Minuten"}
  ];

  const STORAGE_KEY = "ddf_questions_db"; // Fallback-Key, falls Supabase nicht konfiguriert ist

  /* ---------------- State ---------------- */
  let state = {
    phase: "setup",           // setup | round | voting | stamp | winner
    players: [],              // {id,name,flightNo,hearts,out}
    roundMinutes: 3,
    questions: [],             // die dauerhafte Fragen-Datenbank (500+), inkl. used-Flag
    deck: [],                 // shuffled queue der UNVERWENDETEN Fragen für die laufende Partie
    roundLog: [],             // {frage,antwort,anmerkung,mark,playerId,playerName}
    currentQ: null,
    currentPlayer: null,       // wer wird gerade gefragt (rotiert reihum)
    turnIndex: 0,              // fortlaufender Zähler für die Reihum-Zuteilung
    timeLeft: 0,
    timerId: null,
    running: false,
    voteTarget: null,
    stampName: "",
    loadError: null,
    finale: null           // {players:[a,b], questions:[...10], turn, qIndex, scores, details}
  };

  /* ------------- Fragen-Datenbank: Supabase (mit Fallback) -------------
     Fragen bleiben dauerhaft in Supabase gespeichert (Tabelle "questions").
     Jede Frage hat ein "used"-Flag: einmal in einer Partie gestellt, wird sie
     nicht mehr gezogen — auch nicht in späteren Partien — bis der
     "Fragen-Pool zurücksetzen"-Button gedrückt wird.
     Ohne gültige SUPABASE_URL/KEY läuft die App mit einem lokalen Fallback
     weiter (window.storage), damit hier nichts abstürzt.
  ------------------------------------------------------------------- */
  async function loadQuestions(){
    state.loadError = null;
    if(supabaseClient){
      try{
        const { data, error } = await supabaseClient.from("questions").select("*").order("id",{ascending:true});
        if(error) throw error;
        if(data && data.length>0){
          state.questions = data;
        }else{
          await seedIfEmpty();
        }
        return;
      }catch(e){
        state.loadError = "Verbindung zu Supabase fehlgeschlagen: " + (e.message||e) + " — es wird lokal weitergespielt, bis das behoben ist.";
      }
    }
    // Fallback: lokaler Artefakt-Speicher (nicht dauerhaft außerhalb von Claude)
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      state.questions = (res && res.value) ? JSON.parse(res.value) : SEED_QUESTIONS.map(q=>Object.assign({id:uid()}, q, {used:false}));
    }catch(e){
      state.questions = SEED_QUESTIONS.map(q=>Object.assign({id:uid()}, q, {used:false}));
    }
    if(!supabaseClient && !state.loadError){
      state.loadError = "Supabase ist noch nicht konfiguriert (SUPABASE_URL / SUPABASE_ANON_KEY oben im Code eintragen). Fragen werden vorübergehend lokal gespeichert.";
    }
  }

  async function seedIfEmpty(){
    const rows = SEED_QUESTIONS.map(q=>({frage:q.frage, antwort:q.antwort, anmerkung:null, used:false}));
    const { data, error } = await supabaseClient.from("questions").insert(rows).select();
    state.questions = error ? [] : data;
  }

  async function persistFallback(){
    if(supabaseClient) return;
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state.questions), false); }catch(e){}
  }

  async function commitQuestion(frage, antwort, anmerkung){
    if(supabaseClient){
      try{
        const { data, error } = await supabaseClient.from("questions")
          .insert({frage, antwort, anmerkung: anmerkung || null, used:false})
          .select().single();
        if(error) throw error;
        state.questions.push(data);
      }catch(e){
        alert("Speichern in Supabase fehlgeschlagen: "+(e.message||e));
        return;
      }
    }else{
      state.questions.push({id:uid(), frage, antwort, anmerkung: anmerkung||null, used:false});
      await persistFallback();
    }
    render();
  }

  async function deleteQuestion(id){
    state.questions = state.questions.filter(q=>q.id!==id);
    render();
    if(supabaseClient){
      try{ await supabaseClient.from("questions").delete().eq("id", id); }
      catch(e){ /* lokal schon entfernt, still fine */ }
    }else{
      await persistFallback();
    }
  }

  async function markUsed(id){
    const q = state.questions.find(x=>x.id===id);
    if(q) q.used = true;
    if(supabaseClient){
      try{ await supabaseClient.from("questions").update({used:true}).eq("id", id); }
      catch(e){ /* nicht kritisch, lokal schon markiert */ }
    }else{
      await persistFallback();
    }
  }

  async function resetQuestionPool(){
    state.questions.forEach(q=>q.used=false);
    render();
    if(supabaseClient){
      try{ await supabaseClient.from("questions").update({used:false}).eq("used", true); }
      catch(e){ alert("Zurücksetzen in Supabase fehlgeschlagen: "+(e.message||e)); }
    }else{
      await persistFallback();
    }
  }

  /* ------------- Ähnlichkeits-Check für Duplikate ------------- */
  function normalizeText(s){
    return s.toLowerCase().replace(/[^\wäöüß\s]/gi," ").replace(/\s+/g," ").trim();
  }
  function wordSet(s){
    return new Set(normalizeText(s).split(" ").filter(Boolean));
  }
  function jaccard(a,b){
    const sa=wordSet(a), sb=wordSet(b);
    if(sa.size===0 || sb.size===0) return 0;
    let inter=0;
    sa.forEach(w=>{ if(sb.has(w)) inter++; });
    const union = sa.size + sb.size - inter;
    return union===0 ? 0 : inter/union;
  }
  function levenshtein(a,b){
    const al=a.length, bl=b.length;
    if(al===0) return bl;
    if(bl===0) return al;
    const dp = [];
    for(let i=0;i<=al;i++) dp.push([i]);
    for(let j=1;j<=bl;j++) dp[0][j]=j;
    for(let i=1;i<=al;i++){
      for(let j=1;j<=bl;j++){
        const cost = a[i-1]===b[j-1] ? 0 : 1;
        dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
      }
    }
    return dp[al][bl];
  }
  function levSim(a,b){
    const na=normalizeText(a), nb=normalizeText(b);
    const maxLen = Math.max(na.length, nb.length) || 1;
    return 1 - levenshtein(na,nb)/maxLen;
  }
  function findSimilar(newFrage){
    return state.questions
      .map(q=>({q, score: Math.max(jaccard(newFrage,q.frage), levSim(newFrage,q.frage))}))
      .filter(x=>x.score>=0.55)
      .sort((a,b)=>b.score-a.score)
      .slice(0,4);
  }

  /* ---------------- Helpers ---------------- */
  function uid(){ return Math.random().toString(36).slice(2,9); }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function pad(n){ return n.toString().padStart(2,"0"); }
  function fmt(sec){
    const m = Math.floor(sec/60), s = sec%60;
    return pad(m)+":"+pad(s);
  }
  function activePlayers(){ return state.players.filter(p=>!p.out); }

  function drawQuestion(){
    if(state.deck.length===0){
      return {id:null, frage:"Keine unverwendeten Fragen mehr übrig. Bitte im Check-in auf „Fragen-Pool zurücksetzen“ tippen.", antwort:"–", anmerkung:null};
    }
    return state.deck.pop();
  }

  function assignQuestion(){
    const active = activePlayers();
    state.currentPlayer = active.length ? active[state.turnIndex % active.length] : null;
    state.currentQ = drawQuestion();
  }

  /* ---------------- Rendering ---------------- */
  const app = document.getElementById("app");

  function render(){
    if(state.phase==="setup") return renderSetup();
    if(state.phase==="round") return renderRound();
    if(state.phase==="voting") return renderVoting();
    if(state.phase==="stamp") return renderStamp();
    if(state.phase==="finale-intro") return renderFinaleIntro();
    if(state.phase==="finale-tiebreak-intro") return renderFinaleTiebreakIntro();
    if(state.phase==="finale-question") return renderFinaleQuestion();
    if(state.phase==="finale-handoff") return renderFinaleHandoff();
    if(state.phase==="finale-review") return renderFinaleReview();
    if(state.phase==="finale-result") return renderFinaleResult();
    if(state.phase==="winner") return renderWinner();
  }

  function header(){
    return `
      <div class="eyebrow">Departures · Quizmaster</div>
      <h1 class="title">Der Dümmste fliegt</h1>
    `;
  }

  function boardStrip(askingId){
    return `
      <div class="board">
        ${state.players.map(p=>`
          <div class="board-item ${p.out?'out':''} ${p.id===askingId?'asking':''}">
            <div class="fn">${p.flightNo}</div>
            <div class="nm">${escapeHtml(p.name)}</div>
            <div class="hearts">${'❤'.repeat(p.hearts)}${'♡'.repeat(3-p.hearts)}</div>
            <div class="status">${p.out?'✈ abgeflogen':(p.id===askingId?'jetzt dran':'boarding')}</div>
          </div>
        `).join("")}
      </div>
    `;
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function qListHtml(filter){
    const term = (filter||"").toLowerCase().trim();
    const filtered = term
      ? state.questions.filter(q=> q.frage.toLowerCase().includes(term) || q.antwort.toLowerCase().includes(term))
      : state.questions;
    if(filtered.length===0){
      return `<div style="color:var(--text-dim);font-size:13px;padding:6px 2px;">Keine Treffer.</div>`;
    }
    const shown = filtered.slice(0,300);
    let html = shown.map(q=>`
      <div class="qitem">
        <div class="qtext">
          ${escapeHtml(q.frage)}
          <span class="a">${escapeHtml(q.antwort)}${q.anmerkung?` · <em>${escapeHtml(q.anmerkung)}</em>`:""}</span>
          ${q.used?'<span style="display:block;color:var(--text-dim);font-size:10px;margin-top:2px;">bereits verwendet</span>':""}
        </div>
        <button class="btn-ghost" data-delq="${q.id}">✕</button>
      </div>
    `).join("");
    if(filtered.length>300){
      html += `<div style="color:var(--text-dim);font-size:12px;padding:4px 2px;">… und ${filtered.length-300} weitere. Weiter oben tippen, um einzugrenzen.</div>`;
    }
    return html;
  }

  function toQId(raw){
    // Supabase-IDs sind numerisch (bigint), Fallback-IDs sind Strings (uid())
    const n = Number(raw);
    return (!isNaN(n) && supabaseClient) ? n : raw;
  }

  function bindQListDelete(){
    document.querySelectorAll("[data-delq]").forEach(b=>{
      b.onclick = ()=> deleteQuestion(toQId(b.dataset.delq));
    });
  }

  function renderSetup(){
    const pool = state.questions.length;
    const usedCount = state.questions.filter(q=>q.used).length;
    app.innerHTML = `
      ${header()}
      <p class="subtitle">Check-in: Spieler einchecken, dann geht's los.</p>

      ${state.loadError ? `
        <div class="card" style="border-color:var(--danger);">
          <h2 style="color:var(--danger);">Hinweis</h2>
          <p class="subtitle" style="margin:0;">${escapeHtml(state.loadError)}</p>
        </div>
      ` : ""}

      <div class="card">
        <h2>Rundendauer</h2>
        <div class="row">
          <div>
            <label>Minuten pro Runde</label>
            <input type="number" id="roundMinutes" min="1" max="15" value="${state.roundMinutes}">
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Spieler einchecken</h2>
        <div class="row">
          <div>
            <label>Name</label>
            <input type="text" id="playerName" placeholder="z. B. Anna" maxlength="20">
          </div>
          <button class="btn-amber" id="addPlayerBtn">+ Hinzufügen</button>
        </div>
        <div class="pass-grid" id="passGrid">
          ${state.players.map(p=>`
            <div class="pass">
              <span class="flightno">${p.flightNo}</span>
              <span>${escapeHtml(p.name)}</span>
              <button class="btn-ghost" data-remove="${p.id}">✕</button>
            </div>
          `).join("") || `<span style="color:var(--text-dim);font-size:13px;">Noch niemand eingecheckt.</span>`}
        </div>

        <details open>
          <summary>Fragen-Datenbank (${pool} Fragen, ${usedCount} bereits verwendet)</summary>
          <div class="row" style="margin-top:12px;">
            <div>
              <label>Frage</label>
              <input type="text" id="newQ" placeholder="Neue Frage">
            </div>
          </div>
          <div class="row" style="margin-top:8px;">
            <div>
              <label>Lösung</label>
              <input type="text" id="newA" placeholder="Antwort">
            </div>
          </div>
          <div class="row" style="margin-top:8px;">
            <div>
              <label>Anmerkung zur Antwort (optional)</label>
              <input type="text" id="newNote" placeholder="z. B. zusätzlicher Kontext">
            </div>
            <button class="btn-outline" id="addQBtn">+ Frage speichern</button>
          </div>
          <div class="row" style="margin-top:14px;">
            <div>
              <label>Suche in der Datenbank</label>
              <input type="text" id="qSearch" placeholder="Frage oder Antwort durchsuchen …">
            </div>
          </div>
          <div class="qlist" id="qlist" style="max-height:280px;">
            ${qListHtml("")}
          </div>
          <div class="qcount">${pool} Fragen insgesamt, davon ${usedCount} bereits verwendet. Neue Fragen bleiben dauerhaft erhalten und werden beim Speichern auf ähnliche bestehende Fragen geprüft.</div>
          <div class="row" style="margin-top:12px;">
            <button class="btn-outline" id="resetPoolBtn">🔄 Fragen-Pool zurücksetzen</button>
          </div>
        </details>
      </div>

      <button class="btn-amber btn-block btn-lg" id="startBtn" ${state.players.length<2?'disabled style="opacity:.45;cursor:not-allowed;"':''}>✈ Spiel starten</button>
      ${state.players.length<2?'<p class="subtitle" style="text-align:center;margin-top:8px;">Mindestens 2 Spieler einchecken.</p>':''}
    `;

    document.getElementById("addPlayerBtn").onclick = addPlayer;
    document.getElementById("playerName").addEventListener("keydown", e=>{ if(e.key==="Enter") addPlayer(); });
    document.getElementById("roundMinutes").onchange = e=>{
      const v = parseInt(e.target.value,10);
      state.roundMinutes = (v>=1 && v<=15) ? v : state.roundMinutes;
    };
    document.getElementById("addQBtn").onclick = addQuestion;
    document.getElementById("startBtn").onclick = startGame;
    document.getElementById("resetPoolBtn").onclick = confirmResetPool;
    document.getElementById("qSearch").addEventListener("input", e=>{
      document.getElementById("qlist").innerHTML = qListHtml(e.target.value);
      bindQListDelete();
    });
    app.querySelectorAll("[data-remove]").forEach(b=>{
      b.onclick = ()=>{
        state.players = state.players.filter(p=>p.id!==b.dataset.remove);
        render();
      };
    });
    bindQListDelete();
  }

  function addPlayer(){
    const input = document.getElementById("playerName");
    const name = input.value.trim();
    if(!name) return;
    const flightNo = "FL"+pad(state.players.length+1);
    state.players.push({id:uid(), name, flightNo, hearts:3, out:false});
    input.value="";
    render();
    document.getElementById("playerName").focus();
  }

  function addQuestion(){
    const q = document.getElementById("newQ").value.trim();
    const a = document.getElementById("newA").value.trim();
    const note = document.getElementById("newNote").value.trim();
    if(!q || !a) return;
    const matches = findSimilar(q);
    if(matches.length>0){
      showDuplicateModal(q,a,note,matches);
    }else{
      commitQuestion(q,a,note);
    }
  }

  function showDuplicateModal(q,a,note,matches){
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `
      <div class="modal" style="max-width:440px;text-align:left;">
        <div class="eyebrow" style="justify-content:center;">Möglicherweise schon vorhanden</div>
        <h2 style="font-family:'Archivo Black',sans-serif;font-size:17px;margin:8px 0 12px;text-align:center;">Ähnliche Frage${matches.length>1?'n':''} gefunden</h2>
        <div class="qlist" style="max-height:200px;">
          ${matches.map(m=>`
            <div class="qitem">
              <div class="qtext">${escapeHtml(m.q.frage)}<span class="a">${escapeHtml(m.q.antwort)}</span></div>
              <span style="font-family:'Space Mono',monospace;font-size:11px;color:var(--amber);white-space:nowrap;">${Math.round(m.score*100)}%</span>
            </div>
          `).join("")}
        </div>
        <div class="mbtns">
          <button class="btn-outline" id="dupCancel">Bearbeiten</button>
          <button class="btn-danger" id="dupSaveAnyway">Trotzdem speichern</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById("dupCancel").onclick = ()=> overlay.remove();
    document.getElementById("dupSaveAnyway").onclick = ()=>{
      overlay.remove();
      commitQuestion(q,a,note);
    };
  }

  function confirmResetPool(){
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `
      <div class="modal">
        <div class="eyebrow" style="justify-content:center;">Bestätigen</div>
        <h2 style="font-family:'Archivo Black',sans-serif;margin:8px 0;">Fragen-Pool zurücksetzen?</h2>
        <p class="subtitle" style="margin:0;">Alle Fragen gelten danach wieder als unverwendet und können erneut gezogen werden.</p>
        <div class="mbtns">
          <button class="btn-outline" id="cancelReset">Abbrechen</button>
          <button class="btn-danger" id="confirmResetBtn">Ja, zurücksetzen</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById("cancelReset").onclick = ()=> overlay.remove();
    document.getElementById("confirmResetBtn").onclick = ()=>{
      overlay.remove();
      resetQuestionPool();
    };
  }

  function startGame(){
    if(state.players.length<2) return;
    const unused = state.questions.filter(q=>!q.used);
    if(unused.length===0){
      alert("Alle Fragen wurden bereits verwendet. Bitte zuerst den Fragen-Pool zurücksetzen.");
      return;
    }
    state.roundLog = [];
    state.turnIndex = 0;
    if(state.players.length===2){
      startFinale();
    }else{
      state.deck = shuffle(unused);
      beginRound();
    }
  }

  function startFinale(){
    const active = activePlayers();
    const unused = state.questions.filter(q=>!q.used);
    if(unused.length===0){
      alert("Keine unverwendeten Fragen mehr für das Finale übrig. Bitte zuerst den Fragen-Pool zurücksetzen.");
      state.phase = "setup";
      render();
      return;
    }
    const count = Math.min(10, unused.length);
    const chosen = shuffle(unused).slice(0, count);
    const players = active.slice(0,2);
    const scores = {}, details = {};
    players.forEach(p=>{ scores[p.id]=0; details[p.id]=[]; });
    state.finale = { players, questions: chosen, turn: 0, qIndex: 0, scores, details, isTieBreak:false, winnerId:null };
    state.phase = "finale-intro";
    render();
  }

  function startTieBreak(){
    const unused = state.questions.filter(q=>!q.used);
    if(unused.length===0){
      // Keine Fragen mehr übrig, um das Unentschieden aufzulösen — bleibt Unentschieden.
      state.phase = "finale-result";
      render();
      return;
    }
    const count = Math.min(5, unused.length);
    state.finale.questions = shuffle(unused).slice(0, count);
    state.finale.turn = 0;
    state.finale.qIndex = 0;
    state.finale.isTieBreak = true;
    state.finale.players.forEach(p=>{ state.finale.details[p.id] = []; });
    state.phase = "finale-tiebreak-intro";
    render();
  }

  function beginRound(){
    state.phase = "round";
    assignQuestion();
    state.roundLog = [];
    state.timeLeft = state.roundMinutes*60;
    state.running = true;
    clearInterval(state.timerId);
    state.timerId = setInterval(tick, 1000);
    render();
  }

  function tick(){
    if(!state.running) return;
    state.timeLeft--;
    const el = document.getElementById("timerDisplay");
    if(el){
      el.textContent = fmt(Math.max(0,state.timeLeft));
      el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick");
    }
    if(state.timeLeft<=0){
      clearInterval(state.timerId);
      state.running = false;
      endRound();
    }
  }

  function renderRound(){
    const askingName = state.currentPlayer ? state.currentPlayer.name : "–";
    app.innerHTML = `
      ${header()}
      ${boardStrip(state.currentPlayer ? state.currentPlayer.id : null)}
      <div class="timer-wrap">
        <div class="flip" id="timerDisplay">${fmt(state.timeLeft)}</div>
        <div class="timer-controls">
          <button class="btn-outline" id="pauseBtn">${state.running?'⏸ Pause':'▶ Weiter'}</button>
          <button class="btn-danger" id="endRoundBtn">Runde jetzt beenden</button>
        </div>
      </div>

      <div class="card qcard">
        <div class="eyebrow" style="justify-content:center;">Frage an</div>
        <div class="target-name">${escapeHtml(askingName)}</div>
        <div class="qnum">Frage ${state.roundLog.length+1}</div>
        <div class="qtext">${escapeHtml(state.currentQ.frage)}</div>
        <div class="atext">Lösung: ${escapeHtml(state.currentQ.antwort)}</div>
        ${state.currentQ.anmerkung ? `<div style="color:var(--text-dim);font-size:12px;margin-top:8px;">${escapeHtml(state.currentQ.anmerkung)}</div>` : ""}
        <div class="qbtns">
          <button class="btn-teal" id="rightBtn">✓ Richtig beantwortet</button>
          <button class="btn-danger" id="wrongBtn">✗ Falsch beantwortet</button>
          <button class="btn-outline" id="skipBtn">Überspringen</button>
        </div>
      </div>
      <div class="stats">Bisher in dieser Runde: ${state.roundLog.filter(x=>x.mark==='right').length} richtig · ${state.roundLog.filter(x=>x.mark==='wrong').length} falsch · ${state.roundLog.filter(x=>x.mark==='skip').length} übersprungen</div>
    `;
    document.getElementById("pauseBtn").onclick = ()=>{
      state.running = !state.running;
      render();
    };
    document.getElementById("endRoundBtn").onclick = ()=>{
      clearInterval(state.timerId);
      state.running=false;
      endRound();
    };
    document.getElementById("rightBtn").onclick = ()=>nextQuestion("right");
    document.getElementById("wrongBtn").onclick = ()=>nextQuestion("wrong");
    document.getElementById("skipBtn").onclick = ()=>nextQuestion("skip");
  }

  function nextQuestion(mark){
    if(state.currentQ && state.currentQ.id!=null){
      state.roundLog.push({
        frage:state.currentQ.frage,
        antwort:state.currentQ.antwort,
        anmerkung:state.currentQ.anmerkung,
        mark,
        playerId: state.currentPlayer ? state.currentPlayer.id : null,
        playerName: state.currentPlayer ? state.currentPlayer.name : "–"
      });
      markUsed(state.currentQ.id);
      state.turnIndex++;
    }
    assignQuestion();
    render();
  }

  function endRound(){
    state.phase = "voting";
    render();
  }

  function groupByPlayer(list){
    const map = {};
    const order = [];
    list.forEach(x=>{
      const key = x.playerName || "–";
      if(!map[key]){ map[key]=[]; order.push(key); }
      map[key].push(x);
    });
    return order.map(name=>({name, items:map[name]}));
  }

  function renderVoting(){
    const active = activePlayers();
    const wrong = state.roundLog.filter(x=>x.mark==='wrong');
    const grouped = groupByPlayer(wrong);
    app.innerHTML = `
      ${header()}
      ${boardStrip()}
      <div class="card">
        <h2>Runde beendet — wer fliegt?</h2>
        <p class="subtitle" style="margin-bottom:0;">Stimmt im Raum ab, wer die dümmste Antwort gegeben hat, und tippe den Spieler an.</p>
        <div class="vote-grid">
          ${active.map(p=>`
            <div class="vote-card" data-vote="${p.id}">
              <div class="nm">${escapeHtml(p.name)}</div>
              <div class="hearts">${'❤'.repeat(p.hearts)}${'♡'.repeat(3-p.hearts)}</div>
            </div>
          `).join("")}
        </div>
      </div>

      <div class="card">
        <h2>✗ Falsch beantwortet in dieser Runde (${wrong.length})</h2>
        ${grouped.length===0
          ? `<p class="subtitle" style="margin:0;">Alles richtig beantwortet in dieser Runde. 🎉</p>`
          : grouped.map(g=>`
              <div style="margin-bottom:16px;">
                <div style="font-family:'Archivo Black',sans-serif;font-size:13px;color:var(--amber);letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px;">${escapeHtml(g.name)} (${g.items.length})</div>
                <div class="qlist" style="max-height:none;">
                  ${g.items.map(x=>`
                    <div class="qitem">
                      <div class="qtext">${escapeHtml(x.frage)}<span class="a">Lösung: ${escapeHtml(x.antwort)}${x.anmerkung?` · <em>${escapeHtml(x.anmerkung)}</em>`:""}</span></div>
                    </div>
                  `).join("")}
                </div>
              </div>
            `).join("")
        }
      </div>
    `;
    app.querySelectorAll("[data-vote]").forEach(el=>{
      el.onclick = ()=> confirmVote(el.dataset.vote);
    });
  }

  function confirmVote(playerId){
    const p = state.players.find(x=>x.id===playerId);
    if(!p) return;
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `
      <div class="modal">
        <div class="eyebrow" style="justify-content:center;">Bestätigen</div>
        <h2 style="font-family:'Archivo Black',sans-serif;margin:8px 0;">${escapeHtml(p.name)} verliert ein Herz?</h2>
        <p class="subtitle" style="margin:0;">Das kann nicht rückgängig gemacht werden.</p>
        <div class="mbtns">
          <button class="btn-outline" id="cancelVote">Abbrechen</button>
          <button class="btn-danger" id="confirmVoteBtn">Ja, Herz weg</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById("cancelVote").onclick = ()=> overlay.remove();
    document.getElementById("confirmVoteBtn").onclick = ()=>{
      overlay.remove();
      applyElimination(p.id);
    };
  }

  function applyElimination(playerId){
    const p = state.players.find(x=>x.id===playerId);
    p.hearts--;
    if(p.hearts<=0){
      p.hearts = 0;
      p.out = true;
      state.stampName = p.name;
      state.phase = "stamp";
      render();
      setTimeout(()=>{
        const remaining = activePlayers();
        if(remaining.length<=1){
          state.phase = "winner";
        }else if(remaining.length===2){
          startFinale();
          return;
        }else{
          beginRound();
          return;
        }
        render();
      }, 1600);
    }else{
      beginRound();
    }
  }

  function renderStamp(){
    app.innerHTML = `
      ${header()}
      <div class="card stamp">
        <div class="plane">✈️</div>
        <div class="word">ABGEFLOGEN</div>
        <div class="sub">${escapeHtml(state.stampName)} ist raus.</div>
      </div>
    `;
  }

  function addConfetti(card){
    for(let i=0;i<24;i++){
      const s = document.createElement("span");
      s.className = "confetti-emoji";
      s.textContent = "✈️";
      s.style.left = Math.random()*100+"%";
      s.style.animationDuration = (1.4+Math.random()*1.4)+"s";
      s.style.animationDelay = (Math.random()*0.6)+"s";
      s.style.fontSize = (14+Math.random()*14)+"px";
      card.appendChild(s);
    }
  }

  function resetToSetup(){
    state.phase="setup";
    state.players=[];
    state.deck=[];
    state.roundLog=[];
    state.turnIndex=0;
    state.currentPlayer=null;
    state.finale=null;
    render();
  }

  function renderWinner(){
    const winner = activePlayers()[0];
    app.innerHTML = `
      ${header()}
      <div class="card winner" id="winnerCard">
        <div class="trophy">🏆</div>
        <h2>${winner ? escapeHtml(winner.name) : ''} gewinnt!</h2>
        <p>Bleibt als Einzige·r am Boden — alle anderen sind abgeflogen.</p>
        <button class="btn-amber btn-lg" id="newGameBtn" style="margin-top:18px;">Neues Spiel</button>
      </div>
    `;
    addConfetti(document.getElementById("winnerCard"));
    document.getElementById("newGameBtn").onclick = resetToSetup;
  }

  /* ---------------- Finale (letzte 2 Spieler) ----------------
     Ab hier zählen keine Herzen mehr: beide bekommen dieselben
     10 (bzw. weniger, falls der Pool kleiner ist) Fragen nacheinander
     vorgelegt — erst Spieler A alle, dann Spieler B alle. Wer mehr
     richtig hat, gewinnt. Zusätzlich wird pro Frage festgehalten,
     was geantwortet wurde.
  ------------------------------------------------------------- */
  function renderFinaleIntro(){
    const [a,b] = state.finale.players;
    app.innerHTML = `
      ${header()}
      <div class="card" style="text-align:center;padding:40px 20px;">
        <div class="eyebrow" style="justify-content:center;">Nur noch zwei an Bord</div>
        <h2 style="font-family:'Archivo Black',sans-serif;font-size:clamp(24px,6vw,34px);margin:10px 0;">🏁 Finale</h2>
        <p class="subtitle">${escapeHtml(a.name)} gegen ${escapeHtml(b.name)} — beide bekommen dieselben ${state.finale.questions.length} Fragen, nacheinander. Wer mehr richtig hat, gewinnt. Herzen zählen jetzt nicht mehr.</p>
        <button class="btn-amber btn-lg" id="startFinaleBtn" style="margin-top:14px;">Finale starten</button>
      </div>
    `;
    document.getElementById("startFinaleBtn").onclick = ()=>{
      state.phase = "finale-question";
      render();
    };
  }

  function renderFinaleTiebreakIntro(){
    const f = state.finale;
    app.innerHTML = `
      ${header()}
      <div class="card" style="text-align:center;padding:40px 20px;">
        <div class="eyebrow" style="justify-content:center;">Unentschieden</div>
        <h2 style="font-family:'Archivo Black',sans-serif;font-size:clamp(22px,5vw,30px);margin:10px 0;">🔁 ${f.questions.length} weitere Fragen</h2>
        <p class="subtitle">Gleichstand — beide bekommen noch ${f.questions.length} zusätzliche Fragen. Wer davon mehr richtig hat, gewinnt.</p>
        <button class="btn-amber btn-lg" id="startTieBtn" style="margin-top:14px;">Weiter</button>
      </div>
    `;
    document.getElementById("startTieBtn").onclick = ()=>{
      state.phase = "finale-question";
      render();
    };
  }

  function renderFinaleQuestion(){
    const f = state.finale;
    const player = f.players[f.turn];
    const q = f.questions[f.qIndex];
    const answeredSoFar = f.details[player.id];
    const scoreSoFar = answeredSoFar.filter(x=>x.mark==='right').length;
    const stageLabel = f.isTieBreak ? "Tie-Break" : ("Durchgang "+(f.turn+1)+"/2");
    app.innerHTML = `
      ${header()}
      <div class="eyebrow" style="justify-content:center;">🏁 Finale · ${stageLabel}</div>
      <div class="card qcard">
        <div class="eyebrow" style="justify-content:center;">Frage an</div>
        <div class="target-name">${escapeHtml(player.name)}</div>
        <div class="qnum">Frage ${f.qIndex+1} von ${f.questions.length}</div>

        <div class="qtext">${escapeHtml(q.frage)}</div>
        <div class="atext">Lösung: ${escapeHtml(q.antwort)}</div>
        ${q.anmerkung ? `<div style="color:var(--text-dim);font-size:12px;margin-top:8px;">${escapeHtml(q.anmerkung)}</div>` : ""}
        <div class="row" style="margin-top:18px;text-align:left;">
          <div>
            <label>Was wurde geantwortet? (optional)</label>
            <input type="text" id="finaleGiven" placeholder="Antwort des Spielers">
          </div>
        </div>
        <div class="qbtns">
          <button class="btn-teal" id="finRightBtn">✓ Richtig</button>
          <button class="btn-danger" id="finWrongBtn">✗ Falsch</button>
        </div>
      </div>
      <div class="stats">${escapeHtml(player.name)} bisher: ${scoreSoFar} richtig von ${answeredSoFar.length} beantwortet</div>
    `;
    document.getElementById("finRightBtn").onclick = ()=>nextFinaleQuestion("right");
    document.getElementById("finWrongBtn").onclick = ()=>nextFinaleQuestion("wrong");
  }

  function nextFinaleQuestion(mark){
    const f = state.finale;
    const player = f.players[f.turn];
    const q = f.questions[f.qIndex];
    const given = (document.getElementById("finaleGiven").value || "").trim();
    f.details[player.id].push({frage:q.frage, antwort:q.antwort, anmerkung:q.anmerkung, given, mark});
    if(f.turn===0){
      markUsed(q.id);
    }
    f.qIndex++;
    if(f.qIndex >= f.questions.length){
      if(f.turn===0){
        f.turn = 1;
        f.qIndex = 0;
        state.phase = "finale-handoff";
      }else{
        state.phase = "finale-review";
      }
    }
    render();
  }

  function renderFinaleHandoff(){
    const f = state.finale;
    const done = f.players[0];
    const next = f.players[1];
    const score = f.details[done.id].filter(x=>x.mark==='right').length;
    app.innerHTML = `
      ${header()}
      <div class="card" style="text-align:center;padding:36px 20px;">
        <div class="eyebrow" style="justify-content:center;">Zwischenstand</div>
        <h2 style="font-family:'Archivo Black',sans-serif;font-size:22px;margin:10px 0;">${escapeHtml(done.name)}: ${score} von ${f.questions.length} richtig</h2>
        <p class="subtitle">Jetzt ist ${escapeHtml(next.name)} an der Reihe — dieselben ${f.questions.length} Fragen.</p>
        <button class="btn-amber btn-lg" id="continueFinaleBtn" style="margin-top:10px;">Weiter</button>
      </div>
    `;
    document.getElementById("continueFinaleBtn").onclick = ()=>{
      state.phase = "finale-question";
      render();
    };
  }

  function finaleQuestionRecap(f){
    const [a,b] = f.players;
    return f.questions.map((q,i)=>{
      const da = f.details[a.id][i];
      const db = f.details[b.id][i];
      const line = (player, d) => `
        <div style="font-size:12px;margin-top:4px;color:${d && d.mark==='right' ? 'var(--teal)' : 'var(--danger)'};">
          <strong style="color:var(--text);">${escapeHtml(player.name)}:</strong>
          ${d ? (d.mark==='right'?'✓':'✗') : '–'}
          ${d && d.given ? escapeHtml(d.given) : '<em style="color:var(--text-dim);">– keine Angabe –</em>'}
        </div>
      `;
      return `
        <div class="qitem" style="flex-direction:column;align-items:stretch;">
          <div class="qtext" style="margin:0;">
            ${i+1}. ${escapeHtml(q.frage)}
            <span class="a">Lösung: ${escapeHtml(q.antwort)}${q.anmerkung?` · <em>${escapeHtml(q.anmerkung)}</em>`:""}</span>
          </div>
          ${line(a, da)}
          ${line(b, db)}
        </div>
      `;
    }).join("");
  }

  function renderFinaleReview(){
    const f = state.finale;
    const [a,b] = f.players;
    const scoreA = f.details[a.id].filter(x=>x.mark==='right').length;
    const scoreB = f.details[b.id].filter(x=>x.mark==='right').length;
    app.innerHTML = `
      ${header()}
      <div class="card">
        <h2>${f.isTieBreak ? 'Tie-Break' : 'Finale'} — Übersicht</h2>
        <p class="subtitle" style="margin:0 0 6px;">${escapeHtml(a.name)}: ${scoreA} von ${f.questions.length} richtig · ${escapeHtml(b.name)}: ${scoreB} von ${f.questions.length} richtig</p>
        <p class="subtitle" style="margin:0;">Wer hat gewonnen? Spieler antippen — oder bei Gleichstand auf „Weiter" für 5 weitere Fragen.</p>
      </div>
      <div class="card">
        <div class="qlist" style="max-height:none;">
          ${finaleQuestionRecap(f)}
        </div>
      </div>
      <div class="vote-grid">
        <div class="vote-card" data-finwin="${a.id}">
          <div class="nm">🏆 ${escapeHtml(a.name)} gewinnt</div>
        </div>
        <div class="vote-card" data-finwin="${b.id}">
          <div class="nm">🏆 ${escapeHtml(b.name)} gewinnt</div>
        </div>
      </div>
      <button class="btn-outline btn-block" id="finTieBtn" style="margin-top:12px;">Unentschieden — weiter mit 5 Fragen</button>
    `;
    app.querySelectorAll("[data-finwin]").forEach(el=>{
      el.onclick = ()=> confirmFinaleWinner(el.dataset.finwin);
    });
    document.getElementById("finTieBtn").onclick = startTieBreak;
  }

  function confirmFinaleWinner(playerId){
    const f = state.finale;
    const p = f.players.find(x=>x.id===playerId);
    if(!p) return;
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `
      <div class="modal">
        <div class="eyebrow" style="justify-content:center;">Bestätigen</div>
        <h2 style="font-family:'Archivo Black',sans-serif;margin:8px 0;">${escapeHtml(p.name)} gewinnt das Finale?</h2>
        <p class="subtitle" style="margin:0;">Beendet das Spiel.</p>
        <div class="mbtns">
          <button class="btn-outline" id="cancelFinWin">Abbrechen</button>
          <button class="btn-amber" id="confirmFinWinBtn">Ja, gewonnen</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById("cancelFinWin").onclick = ()=> overlay.remove();
    document.getElementById("confirmFinWinBtn").onclick = ()=>{
      overlay.remove();
      f.winnerId = p.id;
      state.phase = "finale-result";
      render();
    };
  }

  function renderFinaleResult(){
    const f = state.finale;
    const [a,b] = f.players;
    const scoreA = f.details[a.id].filter(x=>x.mark==='right').length;
    const scoreB = f.details[b.id].filter(x=>x.mark==='right').length;
    const winner = f.players.find(p=>p.id===f.winnerId);
    app.innerHTML = `
      ${header()}
      <div class="card winner" id="winnerCard">
        <div class="trophy">🏆</div>
        <h2>${winner ? escapeHtml(winner.name)+" gewinnt das Finale!" : "Unentschieden!"}</h2>
        <p>${escapeHtml(a.name)}: ${scoreA} von ${f.questions.length} richtig · ${escapeHtml(b.name)}: ${scoreB} von ${f.questions.length} richtig</p>
        <button class="btn-amber btn-lg" id="newGameBtn" style="margin-top:18px;">Neues Spiel</button>
      </div>
    `;
    addConfetti(document.getElementById("winnerCard"));
    document.getElementById("newGameBtn").onclick = resetToSetup;
  }

  /* ---------------- Init ---------------- */
  loadQuestions().then(render);
})();
</script>
</body>
</html>
